# Aqui va la URL de la pagina
baseURL = "http://localhost:1313"

# El nombre del Theme que estes usando
theme = 'hugo-bearblog'

# Metadata basica para la configuracion de la pagina
title = "elsenorb (pagina oficial)"
author = "Brian"
copyright = "Copyright © 2026, ElSeñorB."
languageCode = "en-US"

# Generate a nice robots.txt for SEO
enableRobotsTXT = true

# Generate "Bearblog"-like URLs !only!, see https://bearblog.dev/.
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]
[permalinks]
  blog = "/:slug/"
  tags = "/blog/:slug"

[params]
  # La descripcion de la pagina web. Esto se usara en la metadata del Html que generes.
  description = "B dot Net"

  # La ruta para el "favicon". Deberia de ser un cuadrado (de 32px x 32px) en PNG.
  # Es una buena practica poner un "favicon.ico" en tu carpteta "static" 
  favicon = "images/favicon.png"

  # vease https://gohugo.io/templates/internal#twitter-cards y
  # https://gohugo.io/templates/internal#open-graph.
  # Estas imagenes se usan para las plantillas que se mostraran en sitios como Twitter
  # o Slack cuando estas quieran generar una previsualizacion con un link a tu sitio. 
  images = ["images/share.png"]

  # Otro "titulo". Este se usa como site_name en el opengraph interno de Hugo
  # Vease https://ogp.me/ and https://gohugo.io/templates/internal#open-graph.
  title = "ElSeñorB (pagina oficial)"

  hideMadeWithLine = true

  # By default, if you want to read more than one blog post you have to always go
  # back to the /blog page.
  # By enabling this feature each blog post will have at the end a navigator
   enablePostNavigator = true

  # By default, this theme displays dates with a format like "02 Jan, 2006", but
  # you can customize it by setting the `dateFormat` param in your site's config
  # file. See [Hugo's Format function docs](https://gohugo.io/functions/format/)
  # for details. An example TOML config that uses [ISO
  # 8601](https://en.wikipedia.org/wiki/ISO_8601) format:
  # dateFormat = "2006-01-02"

# Configure markup highlighter to match "Bearblog" aesthetics, see
# https://gohugo.io/configuration/markup/#highlight
[markup]
  [markup.highlight]
    style = 'friendly'
    lineNos = true
    lineNumbersInTable = false
    codeFences = true
